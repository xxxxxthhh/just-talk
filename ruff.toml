target-version = "py311"
line-length = 100

[lint]
# Defaults (E4/E7/E9/F) plus import sorting, bugbear, and pyupgrade.
extend-select = ["I", "B", "UP"]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
# FastAPI's Form(...)/File(...) defaults are the intended idiom.
"backend/app/main.py" = ["B008"]
